# Perfil "dev": base de datos H2 en memoria con datos de demostración.
# Arranque: mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:carnaval;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.com.iwcarnaval=DEBUG
