# Puerto del servidor web
server.port=8080

# Configuración de tu base de datos PostgreSQL local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carnaval_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}



# Configuración automática de tablas por Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.level.com.iwcarnaval=INFO
